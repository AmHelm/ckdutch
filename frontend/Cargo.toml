[package]
name = "ckdutch-ui"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
bls12_381 = { version = "0.8", features = ["experimental"] }
borsh = { version = "1", features = ["derive"] }
bs58 = "0.5"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hkdf = "0.12"
near-account-id = "2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha2_09 = { package = "sha2", version = "0.9" }
sha3 = "0.10"
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["AbortController", "AbortSignal", "Blob", "BlobPropertyBag", "Document", "File", "FileList", "HtmlAnchorElement", "HtmlInputElement", "Location", "Url", "UrlSearchParams", "Window"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
hex = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
