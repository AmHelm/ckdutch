[package]
name = "ckdutch-crypto"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
bls12_381 = { version = "0.8", features = ["experimental"] }
bs58 = "0.5"
hkdf = "0.12"
near-account-id = "2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha2_09 = { package = "sha2", version = "0.9" }
sha3 = "0.10"
wasm-bindgen = "=0.2.128"
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
hex = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
